# Builds installers and attaches them to a (draft) GitHub release.
#
#   macOS    universal (Apple Silicon + Intel) .app (zipped by tauri-action) + .dmg
#   Windows  x64 NSIS installer (+ optional ARM64)
#
# Signing is OPTIONAL and driven purely by repository secrets/variables, so the same workflow
# produces unsigned test builds today and signed builds once credentials are added.
# See docs/SIGNING.md for what each secret/variable means.
#
# macOS secrets (all optional):
#   APPLE_CERTIFICATE            base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Lionsville (TEAMID1234)"
#   notarization, option A (Apple ID):        APPLE_ID, APPLE_PASSWORD (app-specific pw), APPLE_TEAM_ID
#   notarization, option B (App Store Connect API key, preferred):
#                                              APPLE_API_KEY (key id), APPLE_API_ISSUER, APPLE_API_KEY_P8 (contents of AuthKey_XXX.p8)
#
# Windows: repository VARIABLE `WINDOWS_SIGNING` picks the method (TODO: decide with the owner):
#   (unset) / none   unsigned
#   pfx              secrets WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD
#   azure            Azure Trusted Signing: secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID;
#                    variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#   command          any cloud/HSM signer (SSL.com eSigner, DigiCert KeyLocker, ...): variable
#                    WINDOWS_SIGN_COMMAND = full command line with %1 as the file placeholder;
#                    credentials it needs are passed through from secrets WINDOWS_SIGN_ENV_* (see below)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_arm64:
        description: "Also build a Windows ARM64 installer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        shell: bash
        run: |
          inc='[
            {"name":"macOS (universal)","os":"macos-latest","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","args":"--target universal-apple-darwin"},
            {"name":"Windows x64","os":"windows-latest","rust_targets":"x86_64-pc-windows-msvc","args":"--target x86_64-pc-windows-msvc"}
          ]'
          if [ "${{ inputs.windows_arm64 }}" = "true" ] || [ "${{ vars.BUILD_WINDOWS_ARM64 }}" = "true" ]; then
            inc=$(jq -c '. + [{"name":"Windows ARM64","os":"windows-latest","rust_targets":"aarch64-pc-windows-msvc","args":"--target aarch64-pc-windows-msvc"}]' <<<"$inc")
          fi
          echo "include=$(jq -c . <<<"$inc")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust_targets }}

      - run: npm ci
      - run: npm run vendor

      # ---------------------------------------------------------------- macOS signing
      - name: Configure macOS signing / notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # The Tauri bundler treats a *set but empty* variable as configured, so only
          # forward the ones that actually have a value.
          put() { local d="EOF_${RANDOM}${RANDOM}"; { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >> "$GITHUB_ENV"; }
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set: building an ad-hoc signed, NOT notarized app."
            put APPLE_SIGNING_IDENTITY "-"
            exit 0
          fi
          put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          [ -n "$APPLE_SIGNING_IDENTITY" ] && put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            put APPLE_API_KEY "$APPLE_API_KEY"
            put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            put APPLE_API_KEY_PATH "$key"
            echo "Notarizing with an App Store Connect API key."
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            put APPLE_ID "$APPLE_ID"
            put APPLE_PASSWORD "$APPLE_PASSWORD"
            put APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "Notarizing with an Apple ID + app-specific password."
          else
            echo "::warning::No notarization credentials: the app will be signed but NOT notarized."
          fi

      # ---------------------------------------------------------------- Windows signing
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = if ($env:WINDOWS_SIGNING) { $env:WINDOWS_SIGNING.ToLower() } else { 'none' }
          $cfg = $null
          switch ($mode) {
            'none' {
              Write-Output "::warning::WINDOWS_SIGNING not set: building an UNSIGNED installer."
            }
            'pfx' {
              # Classic OV certificate exported as .pfx (only possible for certificates issued
              # before June 2023; newer ones live on a token/HSM - use 'azure' or 'command').
              $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
              Remove-Item $pfx
              $cfg = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } }
            }
            'azure' {
              # Azure Trusted Signing via https://github.com/Levminer/trusted-signing-cli
              # (reads AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID from the env).
              cargo install trusted-signing-cli --locked
              $cmd = "trusted-signing-cli -e $($env:AZURE_SIGNING_ENDPOINT) -a $($env:AZURE_SIGNING_ACCOUNT) -c $($env:AZURE_SIGNING_PROFILE) -d `"MD Reader`" %1"
              $cfg = @{ bundle = @{ windows = @{ signCommand = $cmd } } }
            }
            'command' {
              # TODO(signing): e.g. SSL.com eSigner CodeSignTool or DigiCert KeyLocker smctl.
              # The command must sign the file given as %1 in place (incl. RFC 3161 timestamp).
              if (-not $env:WINDOWS_SIGN_COMMAND) { throw "WINDOWS_SIGN_COMMAND variable is empty" }
              $cfg = @{ bundle = @{ windows = @{ signCommand = $env:WINDOWS_SIGN_COMMAND } } }
            }
            default { throw "Unknown WINDOWS_SIGNING mode '$mode' (expected none|pfx|azure|command)" }
          }
          if ($cfg) {
            $path = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/tauri.signing.conf.json'
            [IO.File]::WriteAllText($path, ($cfg | ConvertTo-Json -Depth 5))
            "TAURI_EXTRA_ARGS=--config src-tauri/tauri.signing.conf.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Output "Windows signing mode: $mode"
          }

      # ---------------------------------------------------------------- build + release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Trusted Signing credentials (used only when WINDOWS_SIGNING=azure).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Credentials for a custom WINDOWS_SIGN_COMMAND (rename to what your signer expects).
          WINDOWS_SIGN_ENV_USERNAME: ${{ secrets.WINDOWS_SIGN_ENV_USERNAME }}
          WINDOWS_SIGN_ENV_PASSWORD: ${{ secrets.WINDOWS_SIGN_ENV_PASSWORD }}
          WINDOWS_SIGN_ENV_TOTP_SECRET: ${{ secrets.WINDOWS_SIGN_ENV_TOTP_SECRET }}
          WINDOWS_SIGN_ENV_CREDENTIAL_ID: ${{ secrets.WINDOWS_SIGN_ENV_CREDENTIAL_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "MD Reader ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

      # Always keep the raw bundles as workflow artifacts too (handy for manual dispatch runs).
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/*/release/bundle/nsis/*.exe
          if-no-files-found: ignore
